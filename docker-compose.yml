services:
  mongodb:
    image: mongo:7.0
    container_name: proofcart-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: proofcart
    volumes:
      - mongodb_data:/data/db
    networks:
      - proofcart-network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proofcart-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/proofcart
      JWT_SECRET: production_docker_proofcart_super_secret_jwt_key_2026_at_least_32_characters
      JWT_EXPIRES_IN: 7d
      SESSION_SECRET: production_docker_proofcart_super_secure_session_secret_2026_32_chars
      CORS_ORIGIN: http://localhost:80,http://localhost:5173,http://localhost
      STORAGE_PROVIDER: local
      UPLOAD_DIR: ./uploads
      MAX_FILE_SIZE_MB: 5
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - proofcart-network

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: proofcart-client
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - api
    networks:
      - proofcart-network

volumes:
  mongodb_data:
  uploads_data:

networks:
  proofcart-network:
    driver: bridge
